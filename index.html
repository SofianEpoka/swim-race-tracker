<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swim Race Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1b2a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    header {
      background-color: #1b263b;
      padding: 15px 20px;
      border-radius: 5px;
      margin-bottom: 20px;
      border: 1px solid #415a77;
    }

    h1 {
      margin: 0;
      color: #00b4d8;
      font-size: 24px;
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .form-box {
      flex: 1;
      background-color: #1b263b;
      padding: 20px;
      border-radius: 5px;
      border: 1px solid #415a77;
    }

    .table-box {
      flex: 2;
      background-color: #1b263b;
      padding: 20px;
      border-radius: 5px;
      border: 1px solid #415a77;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #e0e1dd;
    }

    input, select {
      width: 100%;
      padding: 8px;
      background-color: #0d1b2a;
      border: 1px solid #415a77;
      color: #ffffff;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #00b4d8;
    }

    button {
      background-color: #00b4d8;
      color: #0d1b2a;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #90e0ef;
    }

    .search-box {
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #415a77;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #0d1b2a;
      color: #00b4d8;
    }

    .delete-btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      width: auto;
    }

    .delete-btn:hover {
      background-color: #c1121f;
    }

    .no-data {
      text-align: center;
      color: #a8dadc;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>AquaTrack - Swim Race Tracker</h1>
  </header>

  <div class="container">
    
    <div class="form-box">
      <h3>Add New Race</h3>
      <form id="raceForm">
        <div class="form-group">
          <label for="swimmer">Swimmer Name:</label>
          <input type="text" id="swimmer" required placeholder="e.g. Alex Smith">
        </div>

        <div class="form-group">
          <label for="distance">Distance:</label>
          <select id="distance">
            <option value="50m">50m</option>
            <option value="100m">100m</option>
            <option value="200m">200m</option>
            <option value="400m">400m</option>
            <option value="800m">800m</option>
            <option value="1500m">1500m</option>
          </select>
        </div>

        <div class="form-group">
          <label for="discipline">Discipline:</label>
          <select id="discipline">
            <option value="Freestyle">Freestyle</option>
            <option value="Backstroke">Backstroke</option>
            <option value="Breaststroke">Breaststroke</option>
            <option value="Butterfly">Butterfly</option>
            <option value="Individual Medley">Individual Medley</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pool">Pool Length:</label>
          <select id="pool">
            <option value="SCM (25m)">SCM (25m)</option>
            <option value="LCM (50m)">LCM (50m)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="time">Time:</label>
          <input type="text" id="time" required placeholder="e.g. 00:54.12">
        </div>

        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit">Save Race</button>
      </form>
    </div>

    <div class="table-box">
      <h3>Race Log</h3>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by swimmer name...">
      </div>

      <table>
        <thead>
          <tr>
            <th>Swimmer</th>
            <th>Distance</th>
            <th>Discipline</th>
            <th>Pool</th>
            <th>Time</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>

      <div id="emptyMessage" class="no-data">No race records found.</div>
    </div>

  </div>

  <script>
    var raceForm = document.getElementById('raceForm');
    var tableBody = document.getElementById('tableBody');
    var emptyMessage = document.getElementById('emptyMessage');
    var searchInput = document.getElementById('searchInput');

    var races = [
      {
        id: 1,
        swimmer: 'Michael Phelps',
        distance: '200m',
        discipline: 'Butterfly',
        pool: 'LCM (50m)',
        time: '01:51.51',
        date: '2023-08-12'
      },
      {
        id: 2,
        swimmer: 'Katie Ledecky',
        distance: '800m',
        discipline: 'Freestyle',
        pool: 'LCM (50m)',
        time: '08:04.79',
        date: '2023-09-05'
      }
    ];

    function showTable(filterText) {
      if (filterText === undefined) {
        filterText = '';
      }

      tableBody.innerHTML = '';

      var filteredRaces = [];
      for (var i = 0; i < races.length; i++) {
        var swimmerName = races[i].swimmer.toLowerCase();
        var searchText = filterText.toLowerCase();
        
        if (swimmerName.indexOf(searchText) !== -1) {
          filteredRaces.push(races[i]);
        }
      }

      if (filteredRaces.length === 0) {
        emptyMessage.style.display = 'block';
      } else {
        emptyMessage.style.display = 'none';
      }

      for (var j = 0; j < filteredRaces.length; j++) {
        var race = filteredRaces[j];
        var row = document.createElement('tr');

        row.innerHTML = 
          '<td>' + race.swimmer + '</td>' +
          '<td>' + race.distance + '</td>' +
          '<td>' + race.discipline + '</td>' +
          '<td>' + race.pool + '</td>' +
          '<td>' + race.time + '</td>' +
          '<td>' + race.date + '</td>' +
          '<td><button class="delete-btn" onclick="deleteRace(' + race.id + ')">Delete</button></td>';

        tableBody.appendChild(row);
      }
    }

    raceForm.addEventListener('submit', function(event) {
      event.preventDefault();

      var swimmerInput = document.getElementById('swimmer').value;
      var distanceInput = document.getElementById('distance').value;
      var disciplineInput = document.getElementById('discipline').value;
      var poolInput = document.getElementById('pool').value;
      var timeInput = document.getElementById('time').value;
      var dateInput = document.getElementById('date').value;

      var newRace = {
        id: Date.now(),
        swimmer: swimmerInput,
        distance: distanceInput,
        discipline: disciplineInput,
        pool: poolInput,
        time: timeInput,
        date: dateInput
      };

      races.push(newRace);
      showTable(searchInput.value);
      raceForm.reset();
    });

    function deleteRace(id) {
      var updatedRaces = [];
      for (var k = 0; k < races.length; k++) {
        if (races[k].id !== id) {
          updatedRaces.push(races[k]);
        }
      }
      races = updatedRaces;
      showTable(searchInput.value);
    }

    searchInput.addEventListener('input', function() {
      showTable(searchInput.value);
    });

    window.onload = function() {
      showTable();
    };
  </script>
</body>
</html>
