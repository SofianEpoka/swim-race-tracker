<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swim Race Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b132b;
      color: #f8fafc;
    }
    .custom-card {
      background-color: #1c2541;
      border: 1px solid #3a506b;
    }
    .input-field {
      background-color: #0b132b;
      border: 1px solid #3a506b;
      color: #ffffff;
    }
    .input-field:focus {
      outline: none;
      border-color: #00b4d8;
      box-shadow: 0 0 0 2px rgba(0, 180, 216, 0.2);
    }
  </style>
</head>
<body class="min-h-screen pb-12">
  <header class="bg-slate-900 border-b border-slate-800 py-6 mb-8 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-cyan-500 text-slate-950 p-2.5 rounded-xl shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white">AquaTrack</h1>
          <p class="text-xs text-cyan-400 font-medium">Swim Performance Tracker</p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400 block">Total Races</span>
        <span id="totalRacesCount" class="text-xl font-bold text-cyan-400">0</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-1">
        <div class="custom-card p-6 rounded-2xl shadow-xl sticky top-6">
          <h2 class="text-lg font-semibold text-white mb-4 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Add New Race Result
          </h2>
          
          <form id="swimForm" class="space-y-4">
            <div>
              <label for="swimmerName" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Swimmer Name</label>
              <input type="text" id="swimmerName" required placeholder="e.g. Alex Smith" class="input-field w-full px-3 py-2 rounded-lg text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="raceLength" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Distance</label>
                <select id="raceLength" class="input-field w-full px-3 py-2 rounded-lg text-sm">
                  <option value="50m">50m</option>
                  <option value="100m">100m</option>
                  <option value="200m">200m</option>
                  <option value="400m">400m</option>
                  <option value="800m">800m</option>
                  <option value="1500m">1500m</option>
                </select>
              </div>

              <div>
                <label for="poolLength" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Pool Type</label>
                <select id="poolLength" class="input-field w-full px-3 py-2 rounded-lg text-sm">
                  <option value="SCM (25m)">SCM (25m)</option>
                  <option value="LCM (50m)">LCM (50m)</option>
                </select>
              </div>
            </div>

            <div>
              <label for="discipline" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Discipline</label>
              <select id="discipline" class="input-field w-full px-3 py-2 rounded-lg text-sm">
                <option value="Freestyle">Freestyle</option>
                <option value="Backstroke">Backstroke</option>
                <option value="Breaststroke">Breaststroke</option>
                <option value="Butterfly">Butterfly</option>
                <option value="Individual Medley">Individual Medley</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="raceTime" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Time</label>
                <input type="text" id="raceTime" required placeholder="e.g. 00:54.12" class="input-field w-full px-3 py-2 rounded-lg text-sm">
              </div>

              <div>
                <label for="raceDate" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Date</label>
                <input type="date" id="raceDate" required class="input-field w-full px-3 py-2 rounded-lg text-sm">
              </div>
            </div>

            <button type="submit" class="w-full mt-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2.5 px-4 rounded-lg shadow transition duration-200 text-sm flex items-center justify-center">
              <span>Save Race Entry</span>
            </button>
          </form>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="custom-card rounded-2xl shadow-xl overflow-hidden">
          <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-white">Race Log History</h2>
            <div class="w-48">
              <input type="text" id="searchInput" placeholder="Filter by name..." class="input-field w-full px-3 py-1.5 rounded-lg text-xs">
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                  <th class="py-3 px-4">Swimmer</th>
                  <th class="py-3 px-4">Event</th>
                  <th class="py-3 px-4">Pool</th>
                  <th class="py-3 px-4">Time</th>
                  <th class="py-3 px-4">Date</th>
                  <th class="py-3 px-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="raceTableBody" class="divide-y divide-slate-800">
              </tbody>
            </table>
          </div>

          <div id="emptyMessage" class="p-12 text-center text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <p class="text-sm">No swim race records found.</p>
            <p class="text-xs text-slate-500 mt-1">Fill out the form on the left to add entries.</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const swimForm = document.getElementById('swimForm');
    const raceTableBody = document.getElementById('raceTableBody');
    const emptyMessage = document.getElementById('emptyMessage');
    const totalRacesCount = document.getElementById('totalRacesCount');
    const searchInput = document.getElementById('searchInput');

    let races = [
      {
        id: 1,
        swimmer: 'Michael Phelps',
        length: '200m',
        discipline: 'Butterfly',
        pool: 'LCM (50m)',
        time: '01:51.51',
        date: '2023-08-12'
      },
      {
        id: 2,
        swimmer: 'Katie Ledecky',
        length: '800m',
        discipline: 'Freestyle',
        pool: 'LCM (50m)',
        time: '08:04.79',
        date: '2023-09-05'
      }
    ];

    function updateCounter() {
      totalRacesCount.textContent = races.length;
    }

    function renderTable(filterText = '') {
      raceTableBody.innerHTML = '';

      const filteredRaces = races.filter(race => 
        race.swimmer.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filteredRaces.length === 0) {
        emptyMessage.style.display = 'block';
      } else {
        emptyMessage.style.display = 'none';
      }

      filteredRaces.forEach((race) => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/40 transition-colors duration-150';

        row.innerHTML = `
          <td class="py-3 px-4 font-medium text-white">${race.swimmer}</td>
          <td class="py-3 px-4">
            <span class="inline-block bg-slate-800 text-cyan-300 text-xs px-2 py-0.5 rounded border border-slate-700">
              ${race.length} ${race.discipline}
            </span>
          </td>
          <td class="py-3 px-4 text-xs text-slate-300">${race.pool}</td>
          <td class="py-3 px-4 font-mono text-cyan-400 font-semibold">${race.time}</td>
          <td class="py-3 px-4 text-xs text-slate-400">${race.date}</td>
          <td class="py-3 px-4 text-right">
            <button onclick="deleteRace(${race.id})" class="text-rose-400 hover:text-rose-300 hover:bg-rose-950/40 p-1.5 rounded transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </td>
        `;

        raceTableBody.appendChild(row);
      });

      updateCounter();
    }

    swimForm.addEventListener('submit', function(event) {
      event.preventDefault();

      const swimmer = document.getElementById('swimmerName').value;
      const length = document.getElementById('raceLength').value;
      const discipline = document.getElementById('discipline').value;
      const pool = document.getElementById('poolLength').value;
      const time = document.getElementById('raceTime').value;
      const date = document.getElementById('raceDate').value;

      const newRace = {
        id: Date.now(),
        swimmer: swimmer,
        length: length,
        discipline: discipline,
        pool: pool,
        time: time,
        date: date
      };

      races.push(newRace);
      renderTable(searchInput.value);
      swimForm.reset();
    });

    function deleteRace(id) {
      races = races.filter(race => race.id !== id);
      renderTable(searchInput.value);
    }

    searchInput.addEventListener('input', function(event) {
      renderTable(event.target.value);
    });

    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('raceDate').value = today;
      renderTable();
    };
  </script>
</body>
</html>
